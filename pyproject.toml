[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-ground-filter"
version = "0.1.0"
description = "Label-free ground removal for forest point clouds: self-seeded CANUPO with a shape-rule fallback"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "laspy[lazrs]>=2.0", "plyfile>=0.8"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
forest-ground-filter = "forest_ground_filter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
